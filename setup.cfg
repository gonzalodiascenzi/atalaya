# Configuración compartida de linters Python (la usa el pipeline DevSecOps).
[flake8]
max-line-length = 100
max-complexity = 12
extend-ignore =
    # E203: incompatible con el formateo de black
    E203,
    # W503: line break before binary operator (black rompe así a propósito)
    W503
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    .terraform,
    node_modules,
    src/frontend
per-file-ignores =
    # Los tests pueden tener asserts largos y fixtures sin docstring
    tests/*:E501

[tool:pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
asyncio_default_fixture_loop_scope = function
markers =
    integration: requiere servicios externos levantados (OpenCTI/MISP)
