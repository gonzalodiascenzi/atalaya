# ATALAYA // Alembic
# La URL NO se escribe acá: se lee de DATABASE_URL en migrations/env.py.
# Un DSN con contraseña en un archivo versionado es exactamente lo que el
# pipeline de secretos tiene que rechazar.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Nombres ordenables cronológicamente: al leer `ls versions/` se entiende el
# orden sin abrir un solo archivo.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
